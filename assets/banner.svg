<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0b0d12;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#07080c;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f1f5f9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>

  <!-- Thin accent bar -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#accent)"/>

  <!-- Terminal icon -->
  <g transform="translate(72, 112)">
    <rect width="96" height="96" rx="18" fill="#0f141c" stroke="#1c2430" stroke-width="1.5"/>
    <!-- window dots -->
    <circle cx="16" cy="14" r="3" fill="#1c2430"/>
    <circle cx="28" cy="14" r="3" fill="#1c2430"/>
    <circle cx="40" cy="14" r="3" fill="#1c2430"/>
    <!-- prompt -->
    <text x="18" y="66" font-family="monospace" font-size="36" font-weight="700" fill="url(#accent)">&gt;_</text>
  </g>

  <!-- Title -->
  <text x="200" y="158" font-family="sans-serif" font-size="50" font-weight="700" fill="url(#title)">
    production-stack-skills
  </text>

  <!-- Subtitle -->
  <text x="200" y="196" font-family="sans-serif" font-size="19" fill="#cbd5e1">
    A senior production engineer for your coding agent.
  </text>

  <!-- Compatibility line -->
  <g transform="translate(200, 232)" font-family="monospace" font-size="13" font-weight="700">
    <text x="0" y="0" fill="#94a3b8">FASTAPI</text>
    <text x="90" y="0" fill="#64748b">·</text>
    <text x="106" y="0" fill="#94a3b8">POSTGRES</text>
    <text x="212" y="0" fill="#64748b">·</text>
    <text x="228" y="0" fill="#94a3b8">DOCKER</text>
    <text x="314" y="0" fill="#64748b">·</text>
    <text x="330" y="0" fill="#94a3b8">DEPLOY</text>
    <text x="410" y="0" fill="#64748b">·</text>
    <text x="426" y="0" fill="#94a3b8">OBSERVABILITY</text>
  </g>

  <!-- Bottom footer -->
  <g transform="translate(72, 288)" font-family="sans-serif" font-size="13" fill="#94a3b8">
    <text x="0" y="0">by Vstorm  ·  vstorm.co</text>
    <text x="1056" y="0" text-anchor="end" fill="#94a3b8">Claude Code  ·  Codex  ·  AGENTS.md</text>
  </g>
</svg>
